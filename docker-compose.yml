# Local source deployment, following RentLens and Dividend Orchard.
# docker compose up -d --build    http://127.0.0.1:8791
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-artex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-artex}
    ports:
      - "127.0.0.1:${ARTEX_DB_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  artex:
    image: artex:local
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: build
    env_file:
      - path: .env
        required: false
    environment:
      ARTEX_PG_DSN: postgres://${POSTGRES_USER:-artex}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-artex}?sslmode=disable
      # Model servers on this computer use host.docker.internal in Docker.
      ARTEX_LLM_BASE_URL: ${DOCKER_LLM_BASE_URL:-${ARTEX_LLM_BASE_URL:-}}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${ARTEX_PORT:-8791}:8787"
      - "127.0.0.1:${ARTEX_PROXY_PORT:-8788}:8788"
    volumes:
      - ./data:/app/data
      - authdata:/app/auth
      - ./skills:/app/skills
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8787/api/health"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 10
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  pgdata:
  authdata:
